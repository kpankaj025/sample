server.port=8081
spring.application.name=Sample_project

#POSTGRES PROPERTIES

spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=12345
# (Optional) Spring Boot automatically detects the driver, but it's safe to include
#spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================================
# Specifies the dialect so Hibernate generates SQL optimized for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Controls database schema generation automatically:
# - none: No action is taken.
# - validate: Validates the schema against entities (Recommended for production).
# - update: Updates the schema automatically based on your Entity classes.
# - create: Creates the schema, destroying previous data.
# - create-drop: Creates the schema and drops it when the application stops.
spring.jpa.hibernate.ddl-auto=update

# Enable this to see the SQL statements generated by Hibernate in your console log
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true


# logging properties


